name: Validate WOW Companion
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:scripts
      - run: npm run build
  desktop-smoke:
    name: Windows packaged smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build an updater-enabled Windows installer
        run: node --import tsx scripts/release/package.ts current x64
      - name: Run main and renderer debugger acceptance against the package
        run: node --import tsx scripts/release/smoke.ts x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-smoke-diagnostics
          include-hidden-files: true
          path: .local/packaged-release-*/acceptance/
