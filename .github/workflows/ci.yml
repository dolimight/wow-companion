name: Validate WOW Companion
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:scripts
      - run: npm run build
  desktop-smoke:
    name: Windows packaged smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
      # Electron's binary and electron-builder's tools are downloaded on every run otherwise
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The smoke check runs the unpacked app, so validation skips the installer; release builds it
      - name: Package the unpacked Windows app
        run: node --import tsx scripts/release/package.ts current x64 --dir
      - name: Run main and renderer debugger acceptance against the package
        run: node --import tsx scripts/release/smoke.ts x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-smoke-diagnostics
          include-hidden-files: true
          path: .local/packaged-release-*/acceptance/
