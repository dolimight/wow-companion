name: Release WOW Companion

on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release track
        type: choice
        options: [nightly, stable]
        default: nightly
        required: true
      version:
        description: Optional plain stable version override when promoting a nightly
        type: string
        required: false
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      # The release scripts are TypeScript, so their tooling is installed without running dependency install scripts
      - run: npm ci --ignore-scripts
      - id: metadata
        name: Resolve immutable release commit and channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --import tsx scripts/release/prepare.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.metadata.outputs.publish == 'true'
        with:
          name: release-metadata
          path: .local-release.json
          include-hidden-files: true

  checks:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:scripts

  desktop:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - name: Stamp this build without changing source history
        run: node --import tsx scripts/release/stamp.ts '${{ needs.prepare.outputs.version }}'
      - run: npm run build
      - name: Package desktop and generate its update feed
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node --import tsx scripts/release/package.ts '${{ needs.prepare.outputs.version }}' '${{ matrix.arch }}'
      - name: Exercise the packaged app with both debuggers and an isolated profile
        run: node --import tsx scripts/release/smoke.ts '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/nightly*.yml

  publish:
    needs: [prepare, checks, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-artifacts
      - name: Verify asset hashes and merge architecture manifests
        run: node --import tsx scripts/release/artifacts.ts release-artifacts release-publish '${{ needs.prepare.outputs.version }}'
      - name: Generate notes since the previous release on this track
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/release/notes.ts .local-release.json
      - name: Publish one complete release after all artifacts pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node --import tsx scripts/release/publish.ts
