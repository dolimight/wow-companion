else if(s==='loading')scene='<div class="loading-block" aria-hidden="true"></div><div class="loading-line" aria-hidden="true"></div><h3>Loading character model</h3><p class="small muted" style="margin-top:8px">Preview state · no assets are downloading</p>';
else {const content=s==='unsupported'?['This form is not supported','The dragon-form preview is unavailable in this mock; keep planning the outfit without substituting a different character','Choose another character','character-switch']:s==='error'?['Graphics preview interrupted','Your outfit draft is safe; reload the preview to try again','Reload preview','retry-model']:['Model assets unavailable','The model is not connected in this design mock; saved appearances remain editable','Retry preview','retry-model'];scene='<div class="model-message">'+icon(s==='error'?'refresh':'info')+'<h3>'+content[0]+'</h3><p>'+content[1]+'</p>'+btn(content[2],'refresh','',''+content[3])+'</div>'}
return '<section class="model-stage" aria-label="Character model preview"><div class="model-toolbar">'+segments(['Observed transmog','Equipped look'],state.lookMode,'look-mode')+pill(s==='concept'?'Concept artwork':s==='loading'?'Loading preview':s==='unsupported'?'Unsupported form':'Preview unavailable',s==='concept'?'':'amber')+'</div><div class="model-canvas '+state.lighting.toLowerCase()+'" aria-live="polite">'+scene+'</div><div class="model-controls"><div class="camera-buttons">'+btn('Front','','compact','camera',true)+btn('Back','','compact','camera',true)+btn('Zoom out','minus','compact','camera',true)+btn('Zoom in','plus','compact','camera',true)+btn('Reset','refresh','compact','camera',true)+'</div><p>Camera controls become available when a real 3D model is connected</p></div><div class="model-preferences"><label>Lighting <select id="model-lighting" aria-label="Stage lighting">'+['Neutral','Cool','Warm'].map(v=>'<option'+(state.lighting===v?' selected':'')+'>'+v+'</option>').join('')+'</select></label>'+btn('Idle animation paused','pause','compact','camera',true)+'</div></section>'}
function wardrobeView(){const c=character();let choices=appearanceChoices().filter(x=>!state.collectedOnly||x.status==='Collected');return heading('Your wardrobe',c.name+' · outfit drafts stay with this character',btn('New outfit','plus','','new-outfit')+btn(state.outfitSaved?'Saved draft':'Save outfit','check','primary','save-outfit'))+
'<div class="model-state-tools"><span>Review the planned model states</span><label for="model-state">Demo model state <select id="model-state">'+[['concept','Concept artwork'],['loading','Loading'],['missing','Missing assets'],['unsupported','Unsupported form'],['error','Graphics error']].map(([k,v])=>'<option value="'+k+'"'+(state.modelState===k?' selected':'')+'>'+v+'</option>').join('')+'</select></label></div><div class="model-layout">'+modelStage()+'<section class="wardrobe-editor" aria-label="Outfit editor"><div class="filter-row"><select class="outfit-select" aria-label="Saved outfit" id="outfit-select"><option value="own"'+(state.outfit==='own'?' selected':'')+'>'+escapeHtml(({Mage:'Winterglass regalia',Paladin:'Sunward plate',Evoker:'Emberbound vestments',Druid:'Grovewalker'}[c.className]||'My outfit'))+' · '+escapeHtml(c.name)+'</option><option value="shared"'+(state.outfit==='shared'?' selected':'')+'>Winterglass regalia · shared template</option></select>'+btn('Duplicate','copy','compact','duplicate-outfit')+'</div><div class="collection-context"><strong>'+escapeHtml(outfitName())+'</strong>'+(c.collection?'Collection · Personal account A · demo scope':'Collection scope unknown · link a verified import to check ownership')+'<br>'+escapeHtml(eligibility())+'<br>'+pill(state.outfit==='shared'&&c.armor!=='Cloth'?'Plan as a wishlist':'Character outfit',state.outfit==='shared'&&c.armor!=='Cloth'?'amber':'blue')+'</div><div class="filter-row"><select aria-label="Appearance slot" id="appearance-slot">'+['Head','Shoulder left','Shoulder right','Chest','Weapon'].map(v=>'<option'+(state.slot===v?' selected':'')+'>'+v+'</option>').join('')+'</select><button class="btn '+(state.collectedOnly?'primary':'')+'" data-action="collected" aria-pressed="'+state.collectedOnly+'">'+(state.collectedOnly?icon('check'):'')+'Collected only</button></div><div class="appearance-grid">'+choices.map(x=>'<button class="appearance '+(state.appearance===x.index?'selected':'')+'" data-appearance="'+x.index+'" aria-pressed="'+(state.appearance===x.index)+'"><img src="'+asset(x.image+'.jpg')+'" alt="">'+(state.appearance===x.index?'<span class="check-icon">'+icon('check')+'</span>':'')+'<strong>'+escapeHtml(x.name)+'</strong><small>'+x.status+'</small></button>').join('')+'</div>'+(choices.length?'':'<div class="empty-result"><h3>No verified collected appearances</h3><p>Collection ownership is unknown for '+escapeHtml(c.name)+'</p>'+btn('Show all appearances','eye','','collected')+'</div>')+'<div class="slot-controls"><label>Variant <select id="appearance-variant">'+['Default','Silver','Midnight'].map(v=>'<option'+(state.variant===v?' selected':'')+'>'+v+'</option>').join('')+'</select></label><label><input type="checkbox" id="hide-cloak"'+(state.hiddenCloak?' checked':'')+'> Hide cloak in draft</label></div><div class="outfit-status"><span class="muted">'+escapeHtml(state.slot)+' · '+escapeHtml(state.variant)+(state.hiddenCloak?' · cloak hidden':'')+'</span>'+pill(state.outfitSaved?'Saved in this session':'Draft · '+c.name,state.outfitSaved?'green':'')+'</div><div class="missing-piece"><strong>'+(c.collection?'One appearance to collect':'Collection status needs an import')+'</strong><p>'+(c.collection?'Spire of the First Snow · missing weapon appearance':'Unknown collection status never counts as collected')+'</p>'+btn(c.collection?'View appearance source':'Review import status','arrow','compact',c.collection?'appearance-source':'import')+'</div></section></div><div class="footer-note">'+icon('info')+'Concept art and sample appearances · no live 3D, game changes, or account import</div>'}
function switcherView(){const filtered=roster.filter(c=>!c.archived&&(c.name+' '+c.realm+' '+c.spec).toLowerCase().includes(state.switchSearch.toLowerCase()));return '<div id="character-menu" class="character-menu" popover aria-label="Choose character"><label class="search">'+icon('search')+'<input id="switch-search" aria-label="Find a character to switch to" placeholder="Name, realm, or class" value="'+escapeHtml(state.switchSearch)+'"></label>'+filtered.map(c=>'<button class="switch-option '+(c.id===state.characterId?'selected':'')+'" data-switch="'+c.id+'">'+portrait(c)+'<span class="switch-text"><strong>'+escapeHtml(c.name)+'</strong><small>'+escapeHtml(c.spec)+' · '+escapeHtml(c.realm)+'</small></span>'+(c.id===state.characterId?icon('check'):'')+'</button>').join('')+(filtered.length?'':'<p class="small muted" style="padding:12px">No matching characters</p>')+'<div class="menu-footer">'+btn('View all characters','people','','roster')+'</div></div>'}
function sheetView(){if(!state.sheet)return '';const c=character();let title='Import & sync',sub='Observation time belongs to each character',content=roster.filter(r=>!r.archived).map(r=>'<div class="sync-character"><span><strong>'+escapeHtml(r.name)+'</strong><small>'+r.observed+'</small></span>'+pill(r.age,r.id==='vaelith'?'green':'')+'</div>').join('')+'<dl><dt>Last file check</dt><dd>Just now</dd><dt>Fallback interval</dt><dd>Every 60 seconds</dd></dl><p>A file check does not make an old character snapshot current</p><p style="margin-top:12px">Use /reload or log out normally to save addon data, or paste an export</p><textarea class="import-paste" aria-label="Paste addon export" placeholder="Paste an addon or /simc export"></textarea>'+btn('Import preview','plus','primary','import-preview');
if(state.sheet==='add'||state.sheet==='manage'){title=state.sheet==='add'?'Add a character':'Manage your roster';sub='Changes last for this mock session';content='<form id="add-character-form"><label class="sheet-field">Character name<input id="new-name" name="name" required maxlength="24" placeholder="Character name"></label><label class="sheet-field">Realm<input id="new-realm" name="realm" required maxlength="50" placeholder="Realm name"></label><label class="sheet-field">Region<select name="region"><option>EU</option><option>US</option></select></label><label class="sheet-field">Class<select name="className"><option>Mage</option><option>Paladin</option><option>Evoker</option><option>Druid</option></select></label><p class="small muted" style="margin-top:12px">Creates a fictional preview character with unknown imported data</p><button type="submit" class="btn primary" style="margin-top:14px">'+icon('plus')+'Add preview character</button></form><h3 style="margin-top:28px">Selected character</h3><p style="margin-top:8px">'+escapeHtml(c.name)+' · '+escapeHtml(c.realm)+'</p>'+btn(c.main?'Main character':'Set as main','star','','set-main')+btn('Archive character','bookmark','','archive',roster.filter(r=>!r.archived).length<2)+(roster.some(r=>r.archived)?'<h3 style="margin-top:28px">Archived characters</h3>'+roster.filter(r=>r.archived).map(r=>'<div class="sync-character"><span>'+escapeHtml(r.name)+'</span><button class="btn compact" data-restore="'+r.id+'">Restore</button></div>').join(''):'')}
if(state.sheet==='weekly'){title='Weekly opportunities';sub=c.name+' · '+state.activity;content='<p>Import or enter this character’s current progress before choosing weekly rewards</p><dl><dt>Latest observation</dt><dd>'+c.observed+'</dd><dt>Coverage</dt><dd>Weekly objectives not imported</dd></dl><p>No reward or lockout progress is assumed from another character</p>'+btn('Review import status','refresh','primary','import')}
if(state.sheet==='compare'){const p=state.selectedPlayer||samplePlayers().find(p=>p[1]!==c.name);title='Compare with '+(p?p[1]:'a player');sub=c.spec+' · '+state.activity;content=state.activity!=='Mythic+'?'<p>Detailed '+state.activity.toLowerCase()+' player comparisons are not included in this mock</p><p style="margin-top:12px">Match the encounter or bracket before comparing performance</p>':p?'<dl><dt>Mythic+ rating</dt><dd>'+p[4]+' vs your '+fmt(c.mplus)+'</dd><dt>Equipped item level</dt><dd>'+p[5]+' vs your '+level(c.ilvl)+'</dd><dt>Data coverage</dt><dd>Fictional indexed sample</dd></dl><p>Gear choices and encounter execution are separate comparisons</p>'+btn('Inspect your gear gaps','arrow','primary','gear'):'<p>Choose a player in the Mythic+ sample to compare</p>'}
return '<div class="sheet-layer"><aside class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title"><button class="icon-btn close-sheet" data-action="close-sheet" aria-label="Close panel">'+icon('close')+'</button><h2 id="sheet-title">'+escapeHtml(title)+'</h2><p>'+escapeHtml(sub)+'</p>'+content+'</aside></div>'}
function shell(){const c=character(),labels={roster:'Characters',character:'Character',gear:'Gear planner',standings:'Standings',wardrobe:'Wardrobe'},navIcons={roster:'people',character:'user',gear:'gear',standings:'trophy',wardrobe:'shirt'};return '<div class="titlebar"><span class="title-text">'+icon('snow')+'WoW Companion <span style="margin-left:auto;margin-right:18px">'+escapeHtml(c.name)+'</span></span><div class="native-controls" aria-hidden="true"><span><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></span><span><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></span><span><svg viewBox="0 0 12 12"><path d="m2 2 8 8M10 2l-8 8"/></svg></span></div></div><div class="app-body"><aside class="sidebar"><div class="brand"><span class="brand-mark">'+icon('snow')+'</span><span>Companion</span></div><button class="character-switch" id="switcher-trigger" data-action="character-switch" aria-haspopup="dialog" aria-expanded="'+state.switcherOpen+'" aria-label="Switch character, currently '+escapeHtml(c.name)+'">'+portrait(c)+'<span class="switch-copy"><strong>'+escapeHtml(c.name)+'</strong><small>'+escapeHtml(c.spec)+'</small></span>'+icon('down','chevron')+'</button><div><div class="nav-label">Your workspace</div><nav class="nav-list" aria-label="Main navigation">'+Object.entries(labels).map(([k,l])=>'<button class="nav-item '+(state.view===k?'active':'')+'" data-nav="'+k+'"'+(state.view===k?' aria-current="page"':'')+' aria-label="'+l+'">'+icon(navIcons[k])+'<span>'+l+'</span></button>').join('')+'</nav></div><div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span><span>Stored locally<br>'+escapeHtml(c.name)+' · '+c.age+'</span></div><button class="nav-item" data-action="import" aria-label="Import and sync">'+icon('refresh')+'<span>Import & sync</span></button><div class="sidebar-footer"><span>Personal workspace</span><button class="icon-btn" data-action="theme" aria-label="Switch appearance">'+icon('moon')+'</button></div></div></aside><main class="workspace"><div class="toolbar"><div class="breadcrumbs"><span>'+(state.view==='roster'?'Workspace':escapeHtml(c.name))+'</span>'+icon('chevron')+'<strong>'+labels[state.view]+'</strong></div><div class="toolbar-actions"><span class="small muted toolbar-label">'+(state.view==='roster'?roster.filter(r=>!r.archived).length+' character snapshots':'Observed · '+c.age)+'</span>'+btn(state.view==='roster'?'Refresh roster':'Refresh snapshot','refresh','','import')+'</div></div><div class="page">'+({roster:rosterView,character:characterView,gear:gearView,standings:standingsView,wardrobe:wardrobeView}[state.view])()+'</div></main></div>'+switcherView()+sheetView()}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2800)}
function render(){const focused=document.activeElement,id=focused?.id,nav=focused?.dataset?.nav,caret=focused?.selectionStart;document.getElementById('app').innerHTML=shell();if(state.switcherOpen){const menu=document.getElementById('character-menu');menu.showPopover();const rect=document.getElementById('switcher-trigger').getBoundingClientRect();menu.style.left=Math.min(rect.right+8,innerWidth-295)+'px';menu.style.top=Math.max(8,Math.min(rect.top,innerHeight-440))+'px';menu.addEventListener('toggle',e=>{if(e.newState==='closed'&&menu.isConnected){state.switcherOpen=false;document.getElementById('switcher-trigger')?.setAttribute('aria-expanded','false')}})}let target=id?document.getElementById(id):nav?document.querySelector('[data-nav="'+nav+'"]'):null;if(target){target.focus({preventScroll:true});if(typeof caret==='number'&&target.setSelectionRange)target.setSelectionRange(caret,caret)}}
function showSheet(value){state.sheet=value;state.switcherOpen=false;render();document.querySelector('.close-sheet')?.focus()}
function appEvents(){
document.addEventListener('click',e=>{const b=e.target.closest('button,tr[data-item],tr[data-player],tr[data-character]');if(!b)return;
if(b.dataset.favorite){const c=roster.find(c=>c.id===b.dataset.favorite);c.favorite=!c.favorite;render();return}
if(b.dataset.character){chooseCharacter(b.dataset.character);render();return}
if(b.dataset.switch){chooseCharacter(b.dataset.switch);render();document.getElementById('switcher-trigger')?.focus();return}
if(b.dataset.restore){roster.find(c=>c.id===b.dataset.restore).archived=false;render();return}
if(b.dataset.nav){navigate(b.dataset.nav);return}
if(b.dataset.rosterActivity){state.rosterActivity=b.dataset.rosterActivity;render();return}
if(b.dataset.activity){state.activity=b.dataset.activity;remember();render();return}
if(b.dataset.lookMode){state.lookMode=b.dataset.lookMode;remember();render();return}
if(b.dataset.item!==undefined){state.selectedItem=Number(b.dataset.item);state.view='gear';state.sheet=null;render();return}
if(b.dataset.appearance!==undefined){state.appearance=Number(b.dataset.appearance);state.slotChoices={...state.slotChoices,[state.slot]:{appearance:state.appearance,variant:state.variant}};state.outfitSaved=false;remember();render();return}
if(b.dataset.player){state.selectedPlayer=samplePlayers().find(p=>p[1]===b.dataset.player);showSheet('compare');return}
const a=b.dataset.action;if(!a)return;
if(a==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return}
if(a==='character-switch'){state.switcherOpen=!state.switcherOpen;state.sheet=null;render();document.getElementById('switch-search')?.focus();return}
if(a==='import'){showSheet('import');return}
if(a==='close-sheet'){state.sheet=null;render();document.getElementById('switcher-trigger')?.focus();return}
if(a==='roster'){navigate('roster');return}
if(a==='open-character'){navigate('character');return}
if(a==='gear'){navigate('gear');return}
if(a==='weekly'){showSheet('weekly');return}
if(a==='add-character'||a==='manage-roster'){showSheet(a==='add-character'?'add':'manage');return}
if(a==='set-main'){roster.forEach(c=>c.main=c.id===state.characterId);render();toast(character().name+' is your main in this session');return}
if(a==='archive'){const old=character();old.archived=true;const next=roster.find(c=>!c.archived);chooseCharacter(next.id);state.view='roster';render();toast(old.name+' archived · restore it in Manage roster');return}
if(a==='clear-roster-search'){state.rosterSearch='';render();return}
if(a==='compare-player'){state.selectedPlayer=null;showSheet('compare');return}
if(a==='plan-upgrade'){state.planned=!state.planned;state.saved=false}
else if(a==='save'){state.saved=true;toast('Build saved for '+character().name+' in this mock session')}
else if(a==='duplicate'){state.saved=false;toast('A separate preview draft is ready')}
else if(a==='sim'){toast('Performance estimates need a compatible simulation');return}
else if(a==='collected'){state.collectedOnly=!state.collectedOnly}
else if(a==='save-outfit'){state.outfitSaved=true;toast('Outfit draft saved for '+character().name+' in this session')}
else if(a==='duplicate-outfit'){state.outfitSaved=false;state.outfit='own';toast('Template choices copied to a separate character draft')}
else if(a==='new-outfit'){state.outfit='own';state.appearance=0;state.outfitSaved=false;state.hiddenCloak=false;state.variant='Default';state.slotChoices={};toast('New outfit draft for '+character().name)}
else if(a==='appearance-source'){toast('Sample appearance · verified acquisition sources are not connected');return}
else if(a==='retry-model'){state.modelState=character().art?'concept':character().model;toast('Preview reset · no live model service is connected')}
else if(a==='import-preview'){toast('Preview only · no live character data was imported');return}
remember();render()
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='rank-scope')state.rankScope=t.value;else if(t.id==='roster-sort')state.rosterSort=t.value;else if(t.id==='outfit-select'){state.outfit=t.value;state.outfitSaved=false}else if(t.id==='appearance-slot'){state.slot=t.value;state.appearance=state.slotChoices[state.slot]?.appearance??0;state.variant=state.slotChoices[state.slot]?.variant??'Default';state.outfitSaved=false}else if(t.id==='appearance-variant'){state.variant=t.value;state.slotChoices={...state.slotChoices,[state.slot]:{appearance:state.appearance,variant:state.variant}};state.outfitSaved=false}else if(t.id==='hide-cloak'){state.hiddenCloak=t.checked;state.outfitSaved=false}else if(t.id==='model-state')state.modelState=t.value;else if(t.id==='model-lighting')state.lighting=t.value;else if(t.dataset.field){state[t.dataset.field]=t.value;state.planned=true;state.saved=false}remember();render()});
document.addEventListener('input',e=>{if(e.target.id==='roster-search'){state.rosterSearch=e.target.value;render()}else if(e.target.id==='rank-search'){state.rankSearch=e.target.value;render()}else if(e.target.id==='switch-search'){state.switchSearch=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='add-character-form')return;e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')).trim(),realm=String(data.get('realm')).trim();if(!name||!realm)return;const cls=String(data.get('className'));const id='preview-'+Date.now();roster.push({id,name,realm,region:String(data.get('region')),race:'Unknown race',spec:{Mage:'Frost Mage',Paladin:'Retribution Paladin',Evoker:'Devastation Evoker',Druid:'Balance Druid'}[cls],className:cls,armor:{Mage:'Cloth',Paladin:'Plate',Evoker:'Mail',Druid:'Leather'}[cls],ilvl:null,target:null,max:null,base:null,mplus:null,rank:'Unknown',population:'Unknown',raid:'Unknown',parse:null,pvp:null,age:'Never imported',observed:'No imported snapshot',collection:null,main:false,favorite:false,art:false,model:'missing',new:true,next:'Import a character snapshot',reason:'Gear and progression stay unknown until a snapshot is imported'});chooseCharacter(id);state.view='roster';render();toast('Preview character added · no data has been imported')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.switcherOpen){state.switcherOpen=false;document.getElementById('character-menu')?.hidePopover();document.getElementById('switcher-trigger')?.focus()}else if(state.sheet){state.sheet=null;render();document.getElementById('switcher-trigger')?.focus()}}
if(e.target.matches('tr[data-character],tr[data-item],tr[data-player]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}
if(e.target.id==='switch-search'&&e.key==='ArrowDown'){e.preventDefault();document.querySelector('.switch-option')?.focus()}
if(e.target.matches('.switch-option')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const opts=[...document.querySelectorAll('.switch-option')];opts[(opts.indexOf(e.target)+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length]?.focus()}
});
}
syncItems();render();appEvents();
</script></body></html>
