appId: local.wowcompanion.desktop
productName: WOW Companion
npmRebuild: false
artifactName: WOW-Companion-${version}-${os}-${arch}.${ext}
generateUpdatesFilesForAllChannels: false
publish:
  provider: github
  owner: dolimight
  repo: wow-companion
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: addon
    to: addon
win:
  icon: public/assets/wow-companion.ico
  target: nsis
  signExecutable: false
mac:
  icon: public/assets/wow-companion.icns
  category: public.app-category.utilities
  target:
    - dmg
    - zip
nsis:
  differentialPackage: true
  oneClick: false
  allowToChangeInstallationDirectory: true
